name: Dolorain CUDA 13.2 image - manual build
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate source and shell scripts
        run: |
          python3 -m compileall -q studio/backend pipeline deploy/runpod/preflight.py
          bash -n deploy/runpod/entrypoint.sh deploy/runpod/check-required-models.sh
          python3 -m unittest discover -s studio/tests -p 'test_*.py' -v
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/runpod/Dockerfile
          push: true
          tags: ghcr.io/amandolorain/dolorain-studio:cuda13.2-candidate
