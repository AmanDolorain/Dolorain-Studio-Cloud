<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dolorain Studio</title>
<style>
:root{color-scheme:light dark;font:14px system-ui}*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;background:Canvas;color:CanvasText}
header{display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;padding:.5rem .8rem;border-bottom:1px solid GrayText}strong{margin-right:auto}
button,a{font:inherit;color:inherit;cursor:pointer;text-decoration:none;padding:.3rem .6rem;border:1px solid GrayText;border-radius:.35rem;background:Canvas}
iframe{width:100%;flex:1;border:0}dialog{max-width:min(94vw,850px);width:850px;border-radius:.5rem}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:58vh;overflow:auto;user-select:text}

/* One-line inline telemetry inside the existing Studio header, never cards. */
header{flex-wrap:nowrap;gap:7px;min-height:45px;padding:5px 10px;overflow:hidden}
header>strong{margin-right:10px;flex:0 0 auto;white-space:nowrap}
.studioSubtitle{font-size:11px;font-weight:400;color:GrayText;margin-left:5px}
header>#status{font-size:11px;max-width:116px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.gpuMetrics{display:flex;align-items:center;gap:9px;flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap}
.gpuName{font-weight:650;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 170px;font-size:11px}
.meter{display:inline-flex;align-items:center;gap:4px;flex:0 1 auto;min-width:0;padding:0;border:0;border-radius:0;background:transparent;font-size:10px;white-space:nowrap}
.meterHead{display:inline-flex;align-items:center;gap:4px;color:inherit;font-variant-numeric:tabular-nums}
.meterHead span:last-child{font-weight:600}
.meterTrack{width:23px;height:4px;border-radius:3px;background:#6666;overflow:hidden;flex:none}
.meterFill{display:block;width:0;height:100%;border-radius:3px;background:#16a34a;transition:width .25s}
.meter[data-level="warn"] .meterFill{background:#eab308}
.meter[data-level="high"] .meterFill{background:#dc2626}
.generationTools{display:inline-flex;align-items:center;gap:6px;flex:none;margin:0}
#generate{background:#16a34a;color:white;border-color:#15803d;border-radius:999px;font-weight:650}
#generate:hover{background:#15803d}
#generate:disabled{opacity:.45;cursor:wait}
#genElapsed{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:11px}
header>button,header>a{font-size:11px;white-space:nowrap;padding:4px 6px;flex:none}
@media(max-width:1150px){.meterTrack{width:14px}.gpuMetrics{gap:5px}.gpuName{max-width:116px}header>#status{max-width:75px}}
@media(max-width:850px){header{overflow-x:auto;scrollbar-width:thin}.gpuMetrics{flex:0 0 auto}.gpuName{max-width:135px}}
</style>
<header><strong>Dolorain Studio <span class="studioSubtitle">Workflow Editor</span></strong><div class="gpuMetrics" id="gpuMetrics" aria-label="GPU and RAM monitoring"><span id="gpuName" class="gpuName" title="Detected GPU model">GPU —</span><div class="meter" id="vramMeter" title="VRAM used / total"><div class="meterHead"><span>VRAM</span><span id="gpuVram">—</span></div><div class="meterTrack"><span class="meterFill"></span></div></div><div class="meter" id="ramMeter" title="System RAM used / total"><div class="meterHead"><span>RAM</span><span id="ramValue">—</span></div><div class="meterTrack"><span class="meterFill"></span></div></div><div class="meter" id="loadMeter" title="GPU utilization"><div class="meterHead"><span>Load</span><span id="gpuLoad">—</span></div><div class="meterTrack"><span class="meterFill"></span></div></div><div class="meter" id="tempMeter" title="GPU temperature"><div class="meterHead"><span>Temp</span><span id="gpuTemp">—</span></div><div class="meterTrack"><span class="meterFill"></span></div></div></div><span id="status" role="status">Connecting to engine…</span>
<button id="example" disabled>Open H3 workflow</button><button id="theme" disabled>Light / Dark</button>
<a href="/_studio/dashboard/" target="_blank" rel="noopener">Studio dashboard</a><a id="lab" href="/_studio/open-jupyter" target="_blank" rel="noreferrer" hidden>JupyterLab</a><button id="logs">Logs · Diagnostics</button><div class="generationTools"><button id="generate" disabled title="Queue the current workflow using the native ComfyUI engine">Generate</button><span id="genElapsed" title="Elapsed generation time">Time —</span></div>
</header>
<iframe title="Native node graph" id="canvas"></iframe>
<dialog id="panel"><h2>Logs · Diagnostics</h2><p>Current graph, Box Engine checks and recent execution events. Times in UTC.</p>
<pre id="report">Checking…</pre><button id="refresh">Refresh</button> <button id="copy">Copy report</button> <button id="close">Close</button></dialog>
<script type="module">
const $=id=>document.getElementById(id), frame=$('canvas'), events=[];
let nativeApp, nativeApi;
function log(message){events.push(new Date().toISOString()+' '+String(message).slice(0,420));if(events.length>80)events.shift()}
function delay(ms){return new Promise(resolve=>setTimeout(resolve,ms))}

const gb=n=>Number.isFinite(n)?(n/1073741824).toFixed(1)+'G':'—';
const percent=(used,total)=>Number.isFinite(used)&&Number.isFinite(total)&&total>0?100*used/total:null;
function meter(id,label,pct){
 const el=$(id),p=Number.isFinite(pct)?Math.max(0,Math.min(100,pct)):null;
 el.querySelector('.meterFill').style.width=(p===null?0:p)+'%';
 el.querySelector('.meterHead span:last-child').textContent=label;
 el.dataset.level=p===null?'unknown':p>=90?'high':p>=75?'warn':'normal';
}
async function refreshTelemetry(){
 try{
  const response=await fetch('/_studio/telemetry',{cache:'no-store'});
  if(!response.ok)throw Error('Telemetry HTTP '+response.status);
  const data=await response.json(),g=data.gpu||{},ram=data.ram||{};
  $('gpuName').textContent=g.name||'GPU unavailable';
  meter('vramMeter',gb(g.vram_used_bytes)+' / '+gb(g.vram_total_bytes),
   percent(g.vram_used_bytes,g.vram_total_bytes));
  meter('ramMeter',gb(ram.used_bytes)+' / '+gb(ram.total_bytes),
   percent(ram.used_bytes,ram.total_bytes));
  meter('loadMeter',Number.isFinite(g.load_percent)?Math.round(g.load_percent)+'%':'—',g.load_percent);
  // Temperature is a reading, not memory utilization. Use relative safety
  // ranges purely for bar visualization, never call it GPU load.
  meter('tempMeter',Number.isFinite(g.temperature_c)?Math.round(g.temperature_c)+'°C':'—',
   Number.isFinite(g.temperature_c)?g.temperature_c:null);
 }catch(error){
  $('gpuName').textContent='GPU unavailable';
  for(const id of ['vramMeter','ramMeter','loadMeter','tempMeter'])meter(id,'—',null);
  log('Telemetry: '+error.message);
 }
}
setInterval(refreshTelemetry,10000);void refreshTelemetry();
let generationStartedAt=null,generationRunning=false;
function elapsedLabel(ms){
 const secs=Math.max(0,Math.floor(ms/1000));
 return [Math.floor(secs/3600),Math.floor(secs%3600/60),secs%60].map(n=>String(n).padStart(2,'0')).join(':');
}
function displayElapsed(){
 if(generationRunning&&generationStartedAt!==null)
  $('genElapsed').textContent='Time '+elapsedLabel(Date.now()-generationStartedAt);
}
setInterval(displayElapsed,1000);
function trackGeneration(name){
 if(name==='execution_start'){
  generationStartedAt=Date.now();generationRunning=true;displayElapsed();
 }else if(['execution_success','execution_error','execution_interrupted'].includes(name)){
  displayElapsed();generationRunning=false;
 }
}
$('generate').onclick=async()=>{
 if(!nativeApp?.queuePrompt)return;
 $('generate').disabled=true;
 try{
  // Native ComfyUI queue method preserves the real workflow's validation
  // and optional custom-node execution behaviour.
  await nativeApp.queuePrompt(0);
 }catch(error){
  log('Generate: '+error.message);
  $('status').textContent='Generate failed · see Logs';
 }finally{$('generate').disabled=false}
};

// Keep original ComfyUI tabs, file handling, and nodes; protect JSON drops from
// Edge/browser navigation even when the drop target is inside the iframe.
let jsonDropBusy=false, missingNodeObserver, missingRefreshQueued=false;
function markMissingNodes(){
 missingRefreshQueued=false;
 const doc=frame.contentDocument;
 if(!doc||!nativeApp?.graph)return;
 const missing=new Set((nativeApp.graph._nodes||[])
   .filter(n=>n.has_errors&&n.last_serialization)
   .map(n=>String(n.id)));
 for(const element of doc.querySelectorAll('.lg-node[data-node-id]')){
  if(missing.has(element.dataset.nodeId))element.dataset.dolorainMissing='true';
  else delete element.dataset.dolorainMissing;
 }
}
function scheduleMissingRefresh(){
 if(missingRefreshQueued)return;
 missingRefreshQueued=true;
 frame.contentWindow?.requestAnimationFrame(markMissingNodes);
}
function enableMissingNodeAppearance(){
 const doc=frame.contentDocument;
 if(!doc)return;
 const style=doc.createElement('style');
 style.id='dolorain-missing-node-style';
 style.textContent='.lg-node[data-dolorain-missing="true"]{outline:2px solid #dc2626!important;outline-offset:-2px;background-color:rgba(127,29,29,.16)!important;}'
  +'.lg-node[data-dolorain-missing="true"] [data-testid="node-header"],.lg-node[data-dolorain-missing="true"] .lg-node-header{background-color:#991b1b!important;color:#fff!important;}';
 doc.head.append(style);
 missingNodeObserver?.disconnect();
 missingNodeObserver=new frame.contentWindow.MutationObserver(scheduleMissingRefresh);
 missingNodeObserver.observe(doc.body,{subtree:true,childList:true,attributes:true,
  attributeFilter:['data-node-id']});
 scheduleMissingRefresh();
}
async function openDroppedWorkflows(files){
 if(jsonDropBusy)return;
 if(!nativeApp?.handleFile){
  $('status').textContent='Editor is still loading · try the JSON drop again';
  return;
 }
 jsonDropBusy=true;
 try{
  for(const file of files){
   $('status').textContent='Opening '+file.name+' in Studio…';
   // Genuine native ComfyUI import creates a new tab and restores its graph.
   const result=await nativeApp.handleFile(file,'file_drop');
   if(result===false)throw Error('ComfyUI rejected '+file.name);
   scheduleMissingRefresh();
  }
  $('status').textContent='Workflow opened in Studio';
 }catch(error){
  log('Workflow drop: '+error.message);
  $('status').textContent='Unable to open JSON · see Logs';
 }finally{jsonDropBusy=false;}
}
function attachJsonDrop(target){
 target.addEventListener('dragover',event=>{
  if(event.dataTransfer?.types?.includes('Files')){
   event.preventDefault();
   event.dataTransfer.dropEffect='copy';
  }
 },true);
 target.addEventListener('drop',event=>{
  const files=Array.from(event.dataTransfer?.files||[]).filter(
   file=>/\.json$/i.test(file.name));
  if(!files.length)return; // Leave other files to the native ComfyUI handlers.
  event.preventDefault();
  event.stopImmediatePropagation();
  void openDroppedWorkflows(files);
 },true);
}
attachJsonDrop(document);

/* Node Manager: keep ComfyUI's own previews for installed definitions.
   The optional missing-node browser uses only genuine serialized workflow data. */
let searchPreviewObserver, searchPreviewQueued=false;
function getMissingSnapshots(){
 const graph=nativeApp?.graph;
 if(!graph)return [];
 const seen=new Set(), output=[];
 for(const node of graph._nodes||[]){
  if(!node.has_errors||!node.last_serialization)continue;
  const info=node.last_serialization, type=String(info.type||node.type||'Unknown');
  if(seen.has(type))continue;
  seen.add(type);output.push({type,info});
 }
 return output.sort((a,b)=>a.type.localeCompare(b.type));
}
function addSearchPreview(){
 searchPreviewQueued=false;
 const doc=frame.contentDocument;
 const results=doc?.querySelector('[role="search"] #results-list');
 if(!results||results.querySelector('#dolorain-missing-list'))return;
 const missing=getMissingSnapshots();
 if(!missing.length)return;
 const root=results.closest('[role="search"]');
 if(!root)return;
 const section=doc.createElement('section');
 section.id='dolorain-missing-list';
 section.className='dolorain-missing-list';
 const heading=doc.createElement('div');
 heading.textContent='Missing nodes · current workflow';
 heading.className='dolorain-missing-heading';
 section.append(heading);
 const card=doc.createElement('aside');
 card.className='dolorain-missing-preview';
 card.hidden=true;
 card.setAttribute('aria-live','polite');
 const content=doc.createElement('div');
 card.append(content);
 root.append(card);
 function render(snapshot){
  card.hidden=false;content.replaceChildren();
  const title=doc.createElement('div');title.className='dolorain-preview-title';
  title.textContent=snapshot.info.title||snapshot.type;content.append(title);
  const marker=doc.createElement('div');marker.className='dolorain-preview-status';
  marker.textContent='Missing node · original JSON snapshot';content.append(marker);
  const mini=doc.createElement('div');mini.className='dolorain-preview-node';
  const top=doc.createElement('div');top.className='dolorain-preview-node-title';
  top.textContent=snapshot.info.title||snapshot.type;mini.append(top);
  const ins=Array.isArray(snapshot.info.inputs)?snapshot.info.inputs:[];
  const outs=Array.isArray(snapshot.info.outputs)?snapshot.info.outputs:[];
  const count=Math.max(ins.length,outs.length,1);
  for(let i=0;i<Math.min(count,24);i++){
   const line=doc.createElement('div');line.className='dolorain-preview-port-row';
   const input=doc.createElement('span');input.textContent=ins[i]?.name||'';
   const output=doc.createElement('span');output.textContent=outs[i]?.name||'';
   line.append(input,output);mini.append(line);
  }
  const vals=Array.isArray(snapshot.info.widgets_values)?snapshot.info.widgets_values:[];
  if(vals.length){
   const widgets=doc.createElement('div');widgets.className='dolorain-preview-widget-summary';
   widgets.textContent=vals.length+' saved widget value(s) · controls unavailable until installed';
   mini.append(widgets);
  }
  content.append(mini);
  const metadata=doc.createElement('div');metadata.className='dolorain-preview-meta';
  const size=Array.isArray(snapshot.info.size)?snapshot.info.size:[];
  metadata.textContent='Type: '+snapshot.type+(size.length===2?' · '+Math.round(size[0])+' × '+Math.round(size[1]):'');
  content.append(metadata);
  const notice=doc.createElement('p');
  notice.textContent='Preview reconstructed from the saved workflow. Exact developer widgets and media players require the original package.';
  content.append(notice);
 }
 for(const snapshot of missing){
  const button=doc.createElement('button');
  button.type='button';button.className='dolorain-missing-option';
  button.textContent=snapshot.info.title||snapshot.type;
  button.title='Preview missing node: '+snapshot.type;
  button.addEventListener('pointerenter',()=>render(snapshot));
  button.addEventListener('focus',()=>render(snapshot));
  button.addEventListener('click',()=>render(snapshot));
  section.append(button);
 }
 results.append(section);
 // Switching to an installed result restores the native ComfyUI preview card.
 results.addEventListener('pointerover',event=>{
  if(event.target.closest('[data-testid="result-item"]'))card.hidden=true;
 });
}
function scheduleSearchPreview(){
 if(searchPreviewQueued)return;
 searchPreviewQueued=true;
 frame.contentWindow?.requestAnimationFrame(addSearchPreview);
}
function enableSearchPreview(){
 const doc=frame.contentDocument;
 if(!doc)return;
 const style=doc.createElement('style');
 style.id='dolorain-search-preview-style';
 style.textContent=[
  '.dolorain-missing-list{margin:14px 8px 8px;padding:10px;border-top:1px solid var(--border,#666);display:flex;flex-direction:column;gap:5px}',
  '.dolorain-missing-heading{font-size:12px;font-weight:700;color:#e57373;padding:4px}',
  '.dolorain-missing-option{background:rgba(127,29,29,.16);color:inherit;border:1px solid #9f3232;text-align:left;padding:10px;border-radius:8px;cursor:default}',
  '.dolorain-missing-option:hover,.dolorain-missing-option:focus-visible{outline:2px solid #ef4444}',
  '.dolorain-missing-preview{position:absolute;top:0;left:calc(100% + 14px);z-index:80;width:330px;max-height:75vh;overflow:auto;background:var(--background,#202124);color:var(--foreground,#eee);border:1px solid #a33;border-radius:12px;padding:14px;box-shadow:0 12px 30px #0005}',
  '.dolorain-missing-preview[hidden]{display:none!important}',
  '.dolorain-preview-title{font-weight:700;margin-bottom:5px}',
  '.dolorain-preview-status{font-size:12px;color:#ef8888;margin-bottom:10px}',
  '.dolorain-preview-node{border:1px solid #c44;border-radius:8px;overflow:hidden;background:rgba(120,20,20,.12)}',
  '.dolorain-preview-node-title{background:#991b1b;color:white;padding:9px;font-weight:bold}',
  '.dolorain-preview-port-row{display:flex;justify-content:space-between;gap:10px;padding:5px 10px;font-size:12px}',
  '.dolorain-preview-widget-summary{border-top:1px solid #a33;padding:8px;font-size:11px}',
  '.dolorain-preview-meta{font-size:11px;margin-top:10px;overflow-wrap:anywhere}',
  '.dolorain-missing-preview p{font-size:11px;line-height:1.4;opacity:.8}',
  '@media(max-width:1320px){.dolorain-missing-preview{left:auto;right:0;top:65px;max-width:85vw}}'
 ].join('');
 doc.head.append(style);
 searchPreviewObserver?.disconnect();
 searchPreviewObserver=new frame.contentWindow.MutationObserver(scheduleSearchPreview);
 searchPreviewObserver.observe(doc.body,{subtree:true,childList:true});
 scheduleSearchPreview();
}
async function connect(){
 while(true){try{const r=await fetch('/_studio/ready',{cache:'no-store'});if(r.ok){const data=await r.json();$('lab').hidden=!data.single_login;if(data.ready)break}}catch{}
 $('status').textContent='Engine starting or unavailable · see Logs';await delay(2500)}
 frame.onload=async()=>{
  try{
   const win=frame.contentWindow;
   // Import in the child realm so all custom nodes share the same app and event bus.
   const load=win.Function('path','return import(path)');
   nativeApp=(await load('/scripts/app.js')).app;
   nativeApi=(await load('/scripts/api.js')).api;
   const started=Date.now();
   while(!nativeApp.graph && Date.now()-started<30000)await delay(200);
   if(!nativeApp.graph)throw Error('Native graph did not initialize');
   attachJsonDrop(win.document);enableMissingNodeAppearance();enableSearchPreview();
   $('generate').disabled=false;
   $('example').disabled=$('theme').disabled=false;$('status').textContent='Native editor ready';
   for(const name of ['execution_start','executing','execution_cached','execution_error','execution_interrupted','execution_success','reconnecting','reconnected']){
    nativeApi.addEventListener(name,e=>{const d=e.detail||{},node=d.node_id??d.node??(typeof d==='string'?d:'');
     const detail=[node?'node '+node:'',d.node_type,d.exception_type].filter(Boolean).join(' · ');
     trackGeneration(name);log(name+' '+detail);if(name==='execution_error')$('status').textContent='Execution failed · see Logs'});
   }
  }catch(e){log(e.message);$('status').textContent='Editor integration error · see Logs'}
 };
 frame.src='/?studio_canvas=1';
}
$('example').onclick=async()=>{try{
 const r=await fetch('/_studio/workflow');if(!r.ok)throw Error('H3 workflow unavailable');
 await nativeApp.loadGraphData(await r.json(),true,true,'H3 Example');scheduleMissingRefresh();
}catch(e){log(e.message);$('status').textContent=e.message}};
$('theme').onclick=async()=>{try{const settings=nativeApp.ui.settings;
 const next=['light','dolorain-light'].includes(settings.getSettingValue('Comfy.ColorPalette'))?'dark':'light';
 const palettes=settings.getSettingValue('Comfy.CustomColorPalettes')||{};
 await settings.setSettingValue('Comfy.ColorPalette',palettes['dolorain-'+next]?'dolorain-'+next:next);document.documentElement.style.colorScheme=next;
}catch(e){log(e.message)}};
let reportId=0;
async function refresh(){
 const id=++reportId;let lines=[],graph;
 try{if(nativeApp?.graph){
  const doc=nativeApp.graph.serialize(),nodes=doc.nodes.map(n=>({id:n.id,type:n.type}));
  const links=doc.links.map(l=>Array.isArray(l)?l.slice(0,6):[l.id,l.origin_id,l.origin_slot,l.target_id,l.target_slot,l.type]);
  graph={nodes,links};
 }}catch(e){lines.push('Studio adapter: could not read active graph: '+e.message)}
 try{const r=await fetch('/_studio/diagnostics',graph?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(graph)}:{cache:'no-store'});
 if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();lines.push(...Object.entries(d.layers).map(([k,v])=>k+': '+v),'','Recent server events',...d.events);
 }catch(e){lines.push('Diagnostics endpoint unavailable: '+e.message)}
 lines.push('','Browser execution events',...events);if(id===reportId)$('report').textContent=lines.join('\n');
}
$('logs').onclick=()=>{$('panel').showModal();refresh()};$('refresh').onclick=refresh;$('close').onclick=()=>$('panel').close();
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('report').textContent);$('copy').textContent='Copied'}
 catch{const range=document.createRange();range.selectNodeContents($('report'));getSelection().removeAllRanges();getSelection().addRange(range);$('copy').textContent='Press Ctrl+C'}};
connect();
</script></html>
